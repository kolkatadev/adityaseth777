<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="refresh" content="0; url=https://adityaseth.in/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wait for the ripple effect ;)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #121212;
            color: #e0e0e0;
        }
        .redirect-notice {
            text-align: center;
            padding: 2rem;
        }
        .redirect-notice a {
            color: #53b14f;
            text-decoration: underline;
        }
        .error-msg {
            display: none;
            margin-top: 1rem;
            color: #ff6b6b;
        }
    </style>
</head>

<body>
    <div class="redirect-notice">
        <p>Redirecting to <a href="https://adityaseth.in/">adityaseth.in</a>&hellip;</p>
        <p class="error-msg" id="error-msg"></p>
        <noscript>
            <p>If you are not redirected automatically, please <a href="https://adityaseth.in/">click here</a>.</p>
        </noscript>
    </div>

    <script>
        (function () {
            try {
                window.location.replace("https://adityaseth.in/");
            } catch (err) {
                var el = document.getElementById("error-msg");
                if (el) {
                    el.style.display = "block";
                    el.textContent = "Redirect failed: " + err.message +
                        ". Please click the link above.";
                }
            }
        })();
    </script>
</body>

</html>
